name: Build Amazon Shopping (Dark)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AMAZON_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "AMAZON_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > AmazonShoppingDark.keystore

          chmod 600 AmazonShoppingDark.keystore

      - name: Verify signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_EXPORT_PASSWORD }}
        run: |
          keytool -list \
            -keystore AmazonShoppingDark.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias amazonshoppingdark \
            > /dev/null

          echo "Signing keystore verified."

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Zipalign APK
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/Amazon Shopping (Dark)-aligned.apk"

          "$BUILD_TOOLS/zipalign" \
            -v \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_EXPORT_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          INPUT_APK="app/build/outputs/apk/release/Amazon Shopping (Dark)-aligned.apk"
          FINAL_APK="app/build/outputs/apk/release/Amazon Shopping (Dark).apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks AmazonShoppingDark.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias amazonshoppingdark \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$FINAL_APK" \
            "$INPUT_APK"

      - name: Verify signed APK
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "app/build/outputs/apk/release/Amazon Shopping (Dark).apk"

      - name: Show APK information
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/aapt2" dump badging \
            "app/build/outputs/apk/release/Amazon Shopping (Dark).apk" \
            | head -n 3

      - name: Remove sensitive keystore
        if: always()
        run: |
          rm -f AmazonShoppingDark.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: Amazon-Shopping-Dark-Signed
          path: app/build/outputs/apk/release/Amazon Shopping (Dark).apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: Amazon-Shopping-Dark-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
