name: Create Amazon Shopping Dark Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    name: Generate Signing Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate dedicated release keystore
        env:
          EXPORT_PASSWORD: ${{ secrets.KEYSTORE_EXPORT_PASSWORD }}
        run: |
          set -e

          if [ -z "$EXPORT_PASSWORD" ]; then
            echo "KEYSTORE_EXPORT_PASSWORD is not configured."
            exit 1
          fi

          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/AmazonShoppingDark.keystore \
            -alias amazonshoppingdark \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$EXPORT_PASSWORD" \
            -keypass "$EXPORT_PASSWORD" \
            -dname "CN=Amazon Shopping Dark, OU=Android, O=Self, L=Unknown, S=Unknown, C=US"

      - name: Verify generated keystore
        env:
          EXPORT_PASSWORD: ${{ secrets.KEYSTORE_EXPORT_PASSWORD }}
        run: |
          keytool -list \
            -keystore signing/AmazonShoppingDark.keystore \
            -storepass "$EXPORT_PASSWORD" \
            -alias amazonshoppingdark

      - name: Encrypt keystore
        env:
          EXPORT_PASSWORD: ${{ secrets.KEYSTORE_EXPORT_PASSWORD }}
        run: |
          set -e

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -salt \
            -in signing/AmazonShoppingDark.keystore \
            -out signing/AmazonShoppingDark.keystore.enc \
            -pass env:EXPORT_PASSWORD

          rm signing/AmazonShoppingDark.keystore

      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v6
        with:
          name: Amazon-Shopping-Dark-Encrypted-Signing-Key
          path: signing/AmazonShoppingDark.keystore.enc
          if-no-files-found: error
          retention-days: 7
